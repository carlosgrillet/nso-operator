apiVersion: orchestration.cisco.com/v1alpha1
kind: NSO
metadata:
  labels:
    app.kubernetes.io/name: nso-operator
    app.kubernetes.io/managed-by: kustomize
  name: nso-sample
spec:
  image: carlosgrillet/cisco-nso:6.1.19-prod
  serviceName: "nso-prod"
  replicas: 1
  labelSelector:
    app: "nso"
  ports:
    - name: "http" 
      port: 8080 
    - name: "https"
      port: 8888 
  adminCredentials:
    username: admin
    passwordSecretRef: nso-admin-password
  nsoConfigRef: nso-config
  env:
    - name: MY_ENV
      value: "container variable"
